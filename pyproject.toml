[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultscan"
version = "0.0.1"
description = "Offline PII leak scanner for freelance devs and small agencies"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "YOUR NAME", email = "you@example.com" }]
keywords = ["pii", "privacy", "dpdp", "security", "local-first", "ollama", "gemma"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
vaultscan = "vaultscan.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
